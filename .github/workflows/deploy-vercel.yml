name: Deploy to Vercel (Production)

# Deploys the site to the Muuras Vercel team using a Vercel token. This is done
# via the Vercel CLI (not the Git integration), so it is NOT subject to the
# Hobby "commit author must be a team member" block — any push to master
# publishes for free. Runs only on the client's repo.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'Felipe-muuras/Muuras'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings & env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (bakes in the Vercel env vars, incl. EmailJS keys)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
